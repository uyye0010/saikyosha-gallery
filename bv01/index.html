<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BETWEEN VENUES Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
/* Layout: one full-screen 45° room that changes between everyday places; space switcher under the title, a use-case card on the left, item sheet on the right (bottom sheet on phones). */
:root{
  --sumi:#1c1a17; --sumi-2:#2a2723; --kinari:#f2ede2; --suna:#e6dfd1; --shu:#b8442b; --tetsu:#23504a; --nibi:#8d867a; --kiiro:#e8c547;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-latin:"Cormorant Garamond","Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--sumi);color:var(--kinari);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.pointing{cursor:pointer}#stage.dragging{cursor:grabbing}
canvas{display:block}
.hud{position:fixed;z-index:5;pointer-events:none}.hud>*{pointer-events:auto}
#top{top:0;left:0;right:0;display:flex;flex-direction:column;gap:10px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:26px;
  background:linear-gradient(var(--sumi) 0%,var(--sumi) 55%,rgba(28,26,23,0) 100%);transition:opacity .4s}
.row1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow{font-family:var(--f-latin);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--nibi)}
.ttl{font-family:var(--f-display);font-size:clamp(18px,2.2vw,25px);font-weight:600;letter-spacing:.05em;line-height:1.35;text-wrap:balance}
.ttl small{display:inline-block;margin-left:.6em;font-family:var(--f-body);font-size:12px;font-weight:400;letter-spacing:.06em;color:var(--suna);opacity:.75}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.seg{display:flex;border:1px solid rgba(242,237,226,.28);background:rgba(28,26,23,.72)}
.seg button{all:unset;cursor:pointer;font-size:12.5px;letter-spacing:.06em;padding:8px 12px;color:var(--suna);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--kinari);color:var(--sumi)}
button:focus-visible,a:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
#spaces{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#spaces::-webkit-scrollbar{display:none}
#spaces button{all:unset;cursor:pointer;flex:none;display:flex;align-items:baseline;gap:7px;padding:7px 13px;border:1px solid rgba(242,237,226,.22);background:rgba(28,26,23,.6);font-size:13px;letter-spacing:.06em;color:var(--suna);white-space:nowrap}
#spaces button b{font-family:var(--f-latin);font-weight:500;font-size:12px;color:var(--nibi)}
#spaces button[aria-pressed="true"]{border-color:var(--kiiro);color:var(--kinari)}
#spaces button[aria-pressed="true"] b{color:var(--kiiro)}

#card{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));top:calc(132px + env(safe-area-inset-top,0px));width:min(320px,calc(100vw - 32px));
  background:rgba(28,26,23,.86);border:1px solid rgba(242,237,226,.16);padding:18px 18px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;transition:opacity .4s,transform .4s}
#card .k{font-family:var(--f-latin);font-size:12px;letter-spacing:.22em;color:var(--kiiro)}
#card h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:.05em}
#card .lede{margin:0;font-size:13.5px;line-height:1.75;color:var(--suna)}
#card .uh{font-size:11.5px;letter-spacing:.16em;color:var(--nibi);margin-top:4px}
#card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
#card li{font-size:12.5px;line-height:1.7;color:var(--kinari);padding-left:14px;position:relative}
#card li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:1px;background:var(--kiiro)}
#card .cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
#card .cta a{font-size:12.5px;letter-spacing:.06em;color:var(--sumi);background:var(--kiiro);padding:9px 12px;text-decoration:none}
#card .cta a.ghost{background:transparent;color:var(--kinari);border:1px solid rgba(242,237,226,.4)}
#card .x{all:unset;cursor:pointer;position:absolute;right:10px;top:8px;font-size:18px;color:var(--nibi);padding:4px 6px}
#cardOpen{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));top:calc(132px + env(safe-area-inset-top,0px));all:unset;cursor:pointer;
  font-size:12.5px;letter-spacing:.08em;padding:8px 12px;background:rgba(28,26,23,.86);border:1px solid var(--kiiro);color:var(--kiiro)}
#cardOpen{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));top:calc(132px + env(safe-area-inset-top,0px))}
body.focus #card,body.focus #cardOpen{opacity:0;pointer-events:none}

#hint{left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));font-size:12.5px;letter-spacing:.06em;color:var(--suna);
  background:rgba(28,26,23,.72);border:1px solid rgba(242,237,226,.16);padding:7px 14px;white-space:nowrap;max-width:calc(100vw - 140px);overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}
#rot{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;transition:opacity .4s}
#rot button{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border:1px solid rgba(242,237,226,.3);background:rgba(28,26,23,.78);color:var(--kinari)}
#rot button:hover{border-color:var(--kiiro)}
#strip{left:0;right:0;bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:24px;background:linear-gradient(rgba(28,26,23,0),var(--sumi) 60%);display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;transition:transform .45s,opacity .45s}
#strip::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;flex:none;display:flex;flex-direction:column;gap:6px;width:92px}
.chip .th{height:62px;background:var(--sumi-2) center/cover no-repeat;border:1px solid rgba(242,237,226,.18);transition:border-color .2s,transform .2s}
.chip:hover .th,.chip.on .th{border-color:var(--kiiro);transform:translateY(-2px)}
.chip span{font-size:11px;letter-spacing:.04em;color:var(--suna);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{font-family:var(--f-latin);font-weight:500;color:var(--nibi);margin-right:5px}
body.focus #strip{transform:translateY(110%);opacity:0}
body.focus #hint,body.focus #rot{opacity:0;pointer-events:none}

#sheet{position:fixed;z-index:6;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--kinari);color:var(--sumi);
  transform:translateX(102%);transition:transform .55s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;
  padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));box-sizing:border-box;gap:16px;overflow-y:auto}
body.focus #sheet{transform:none}
#sheet .no{font-family:var(--f-latin);font-size:13px;letter-spacing:.22em;color:var(--shu)}
#sheet h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:24px;letter-spacing:.05em;line-height:1.4;text-wrap:balance}
#sheet .artist{font-size:13px;letter-spacing:.08em;color:#5d574e}
#sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:13px;border-top:1px solid #d5ccbb;padding-top:16px}
#sheet dt{color:#7a7368;letter-spacing:.06em}#sheet dd{margin:0;font-variant-numeric:tabular-nums}
#sheet p{margin:0;font-size:13.5px;line-height:1.9;color:#3b3732}
.pill{align-self:flex-start;font-size:11px;letter-spacing:.12em;padding:3px 9px;border:1px solid var(--tetsu);color:var(--tetsu)}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:13px 16px;font-size:14px;letter-spacing:.08em}
.btn.buy{background:var(--shu);color:var(--kinari)}.btn.buy:hover{background:#9f3923}
.btn.buy[aria-disabled="true"]{background:#d9d1c2;color:#7a7368;cursor:default}
.btn.sub{border:1px solid var(--tetsu);color:var(--tetsu)}
.btn.back{border:1px solid var(--sumi);color:var(--sumi)}.btn.back:hover{background:var(--sumi);color:var(--kinari)}
.note{font-size:11px;color:#8a8275;letter-spacing:.04em;line-height:1.7}
#loader{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--sumi);font-family:var(--f-latin);letter-spacing:.3em;color:var(--nibi);font-size:13px;transition:opacity .6s}
@media (max-width:720px){
  .row1{flex-direction:column;gap:8px}.ctrls{justify-content:flex-start}
  .seg button{font-size:11.5px;padding:6px 9px}
  .ttl small{display:block;margin:2px 0 0}
  #card,#cardOpen{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  #card{max-height:52vh;overflow-y:auto}
  #sheet{top:auto;left:0;width:100%;max-height:58%;transform:translateY(104%);padding-top:22px;gap:11px;
    padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  #sheet h2{font-size:20px}#sheet dl{gap:6px 14px;padding-top:12px}
  .acts{margin-top:6px}.acts .btn{padding:11px 8px}
  body.focus #top{opacity:0;pointer-events:none}
  #hint{display:none}
  #rot{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){#sheet,#strip,#card{transition:none}}
/* embedded in the Saikyosha site: the page around it carries the title and language */
body.embed .brand,body.embed .seg[aria-label="language"]{display:none}
body.embed #top{padding-top:10px;padding-bottom:14px;gap:8px;background:linear-gradient(var(--sumi) 0%,rgba(28,26,23,.0) 100%)}
body.embed .row1{flex-direction:row;justify-content:flex-end}
body.embed #card,body.embed #cardOpen{top:auto;bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body.embed #card{max-height:calc(100% - 200px);overflow-y:auto}
body.embed #hint{display:none}
</style>
</head>
<body>


<div id="stage" aria-label="3D room"></div>
<div id="loader">BETWEEN VENUES · ISSUE 01</div>

<div class="hud" id="top">
  <div class="row1">
    <div class="brand">
      <div class="eyebrow">Saikyosha · Between Venues Issue 01 · Prototype</div>
      <div class="ttl"><span data-t="title">BETWEEN VENUES 創刊号が置かれる場所</span><small data-t="sub">試作 ／ 作品画像と活用例はイメージです</small></div>
    </div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="mode">
        <button id="mWalk" aria-pressed="true" data-t="walk">歩いて見る</button>
        <button id="mClick" aria-pressed="false" data-t="click">クリックで見る</button>
      </div>
      <div class="seg" role="group" aria-label="language">
        <button data-lang="ja" aria-pressed="true">日本語</button>
        <button data-lang="zh" aria-pressed="false">中文</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>
  <div id="spaces" role="group" aria-label="spaces"></div>
</div>

<section id="card" aria-live="polite">
  <button class="x" id="cardClose" aria-label="close">×</button>
  <span class="k" id="cK"></span>
  <h3 id="cName"></h3>
  <p class="lede" id="cLede"></p>
  <div class="uh" data-t="uses">活用例</div>
  <ul id="cUses"></ul>
  <div class="cta"><a id="cContact" target="_blank" rel="noopener" data-t="contact">導入・定期購読のご相談 ↗</a><a class="ghost" id="cAbout" target="_blank" rel="noopener" data-t="about">創刊号について ↗</a></div>
</section>
<button id="cardOpen" hidden data-t="openCard">この場所での活用例</button>

<div class="hud" id="hint"></div>
<div class="hud" id="rot">
  <button id="rotL" data-tt="rotL"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
  <button id="rotR" data-tt="rotR"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></svg></button>
</div>
<div class="hud" id="strip"></div>

<aside id="sheet" aria-live="polite">
  <span class="no" id="sNo"></span>
  <h2 id="sTitle"></h2>
  <div class="artist" id="sArtist"></div>
  <span class="pill" id="sState"></span>
  <dl id="sMeta"></dl>
  <p id="sText"></p>
  <div class="acts">
    <a class="btn buy" id="sBuy" target="_blank" rel="noopener"></a>
    <a class="btn sub" id="sSub" target="_blank" rel="noopener"></a>
    <button class="btn back" id="sBack"></button>
  </div>
  <div class="note" id="sNote"></div>
</aside>

function renderCard(){const S=SPACES[spaceIdx];$('#cK').textContent='SPACE '+S.no;$('#cName').textContent=S.name[lang];$('#cLede').textContent=S.lede[lang];
 $('#cUses').innerHTML=S.uses.map(u=>`<li>${u[lang]}</li>`).join('');$('#cContact').href=url('/contact');$('#cAbout').href=url('/between-venues');
 $('#card').hidden=!cardOpen;$('#cardOpen').hidden=cardOpen}
function renderStrip(){const s=$('#strip');s.innerHTML='';room.items.forEach((it,i)=>{const b=document.createElement('button');b.className='chip';b.dataset.i=i;
 const label=it.kind==='mag'?`<b>BV</b>${lang==='en'?'Issue 01':'創刊号'}`:`<b>${it.id}</b>${it.a.t[lang]}`;b.innerHTML=`<div class="th" style="background-image:url(${it.thumb})"></div><span>${label}</span>`;b.onclick=()=>select(it);s.appendChild(b)})}
function applyLang(){document.documentElement.lang=lang==='zh'?'zh-Hans':lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[lang][e.dataset.t]);
 document.querySelectorAll('[data-tt]').forEach(e=>{e.title=T[lang][e.dataset.tt];e.setAttribute('aria-label',T[lang][e.dataset.tt])});
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));setHint();renderSpaces();renderCard();renderStrip();if(focused)fillSheet(focused)}
function fillSheet(it){const L=T[lang];const S=SPACES[spaceIdx];const buy=$('#sBuy'),sub=$('#sSub');
 if(it.kind==='mag'){$('#sNo').textContent=L.magNo;$('#sTitle').textContent=L.magTitle;$('#sArtist').textContent='';$('#sState').textContent=L.magState;
  $('#sMeta').innerHTML=[[L.pub,L.magPub],[L.lang,L.magLang],[L.artists,L.magArt],[L.release,L.magRel]].map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('');
  $('#sText').textContent=L.inThis+S.uses[0][lang];buy.textContent=L.magBuy;buy.href=url('/contact');buy.removeAttribute('aria-disabled');sub.hidden=false;sub.textContent=L.magSub;sub.href=url('/between-venues');$('#sNote').textContent=L.magNote}
 else{const a=it.a;$('#sNo').textContent='WORK '+a.id;$('#sTitle').textContent=a.t[lang];$('#sArtist').textContent=a.artist[lang];$('#sState').textContent=L.inc;
  $('#sMeta').innerHTML=[[L.size,`${Math.round(a.w*1000)} × ${Math.round(a.h*1000)} mm`],[L.medium,a.m[lang]]].map(([x,y])=>`<dt>${x}</dt><dd>${y}</dd>`).join('');
  $('#sText').textContent=L.workNote;buy.textContent=L.tba;buy.removeAttribute('href');buy.setAttribute('aria-disabled','true');sub.hidden=true;$('#sNote').textContent=''}
 $('#sBack').textContent=L.back;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',room.items[c.dataset.i]===it))}

// ---------- camera ----------
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function tweenTo(pos,tgt,zoom,ms=950){tw={t0:performance.now(),ms,p0:camera.position.clone(),t0v:target.clone(),z0:camera.zoom,p1:pos.clone(),t1:tgt.clone(),z1:zoom}}
function frustumH(){return VIEW*(innerWidth<720?1.25:1)}
function focus(it){focused=it;fillSheet(it);document.body.classList.add('focus');const vh=frustumH(),vw=vh*aspect;const availW=innerWidth>720?(innerWidth-380)/innerWidth:1,availH=innerWidth>720?1:0.42;
 let pos,z;if(it.kind==='mag'){const d=new THREE.Vector3(Math.cos(azim)*0.55,1,Math.sin(azim)*0.55).normalize();pos=it.center.clone().add(d.multiplyScalar(30));z=Math.min(vh*availH/1.1,vw*availW/1.2)}
 else{pos=it.center.clone().add(it.normal.clone().multiplyScalar(1.2));z=Math.min(vh*availH/(it.h*1.6),vw*availW/(it.w*1.5))}tweenTo(pos,it.center,z)}
function unfocus(){if(!focused)return;focused=null;document.body.classList.remove('focus');document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
 const tgt=mode==='walk'?new THREE.Vector3(visitor.position.x,.8,visitor.position.z):new THREE.Vector3(0,.8,0);tweenTo(tgt.clone().add(ISO),tgt,overviewZoom)}
function faceable(it){if(it.kind==='mag')return;const st=Math.PI/4,cd=new THREE.Vector3(Math.cos(azimGoal),0,Math.sin(azimGoal));if(it.normal.dot(cd)>0.3)return;let best=azimGoal,bd=1e9;const base=Math.round(azimGoal/st)*st;
 for(let k=-8;k<=8;k++){const a=base+k*st;if(it.normal.dot(new THREE.Vector3(Math.cos(a),0,Math.sin(a)))>0.6&&Math.abs(a-azimGoal)<bd){bd=Math.abs(a-azimGoal);best=a}}azimGoal=best}
function select(it){faceable(it);if(mode==='click'){focus(it);return}if(focused)unfocus();route=astar(visitor.position,it.spot);pending=it;if(!route.length){focus(it);pending=null;return}showMarker(route[route.length-1])}
function walkTo(p){if(focused)unfocus();pending=null;route=astar(visitor.position,p);if(route.length)showMarker(route[route.length-1])}
function showMarker(p){marker.position.set(p.x,0.014,p.z);marker.material.opacity=.7}
function rotate(d){if(!focused)azimGoal+=d*Math.PI/4}
function goSpace(i){if(focused){focused=null;document.body.classList.remove('focus')}tw=null;spaceIdx=i;buildRoom(i);visitor.visible=mode==='walk';renderSpaces();renderCard();renderStrip();
 try{localStorage.setItem('bv-space',String(i))}catch(e){}}

// ---------- input ----------
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
const vis=o=>{while(o){if(!o.visible)return false;o=o.parent}return true};
function pick(e){const r=renderer.domElement.getBoundingClientRect();ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
 const hit=ray.intersectObjects(room.clickables,false).find(h=>vis(h.object));if(hit)return{ref:hit.object.userData.ref};const f=ray.intersectObject(room.floor)[0];return f?{floor:f.point}:null}
const ptrs=new Map();let drag=null,pinch0=null;
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,moved:false,tgt:target.clone()};
 if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),z:camera.zoom};drag=null}});
stage.addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch0&&ptrs.size===2&&!focused){const[a,b]=[...ptrs.values()];overviewZoom=THREE.MathUtils.clamp(pinch0.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch0.d,0.5,2.4);camera.zoom=overviewZoom;camera.updateProjectionMatrix();return}
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>6)drag.moved=true;
  if(drag.moved&&!focused&&mode==='click'){stage.classList.add('dragging');const s=frustumH()/innerHeight/camera.zoom;const fwd=new THREE.Vector3(-Math.cos(azim),0,-Math.sin(azim)),right=new THREE.Vector3(Math.sin(azim),0,-Math.cos(azim));
   const nt=drag.tgt.clone().add(right.multiplyScalar(-dx*s)).add(fwd.multiplyScalar(dy*s*1.35));nt.x=THREE.MathUtils.clamp(nt.x,-room.RX,room.RX);nt.z=THREE.MathUtils.clamp(nt.z,-room.RZ,room.RZ);target.copy(nt)}return}
 const p=pick(e);const ref=p&&p.ref;if(ref!==hovered){if(hovered&&hovered.hl)hovered.hl.material.opacity=0;hovered=ref||null;if(hovered&&hovered.hl&&!focused)hovered.hl.material.opacity=.9}
 stage.classList.toggle('pointing',!!ref||(mode==='walk'&&!!(p&&p.floor)))});
const end=e=>{ptrs.delete(e.pointerId);stage.classList.remove('dragging');if(ptrs.size<2)pinch0=null;
 if(drag&&!drag.moved&&e.type==='pointerup'){const p=pick(e);if(p&&p.ref){if(focused!==p.ref)select(p.ref)}else if(focused)unfocus();else if(p&&p.floor&&mode==='walk')walkTo(p.floor)}drag=null};
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
stage.addEventListener('wheel',e=>{e.preventDefault();if(focused)return;overviewZoom=THREE.MathUtils.clamp(camera.zoom*Math.exp(-e.deltaY*0.0012),0.5,2.4);camera.zoom=overviewZoom;camera.updateProjectionMatrix()},{passive:false});
addEventListener('keydown',e=>{if(e.key==='Escape')unfocus();if(e.key==='q'||e.key==='Q')rotate(1);if(e.key==='e'||e.key==='E')rotate(-1);keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
$('#sBack').onclick=unfocus;$('#rotL').onclick=()=>rotate(1);$('#rotR').onclick=()=>rotate(-1);
$('#cardClose').onclick=()=>{cardOpen=false;renderCard()};$('#cardOpen').onclick=()=>{cardOpen=true;renderCard()};
$('#mWalk').onclick=()=>setMode('walk');$('#mClick').onclick=()=>setMode('click');
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('sg-lang',lang)}catch(e){}applyLang()});
function setMode(m){mode=m;$('#mWalk').setAttribute('aria-pressed',m==='walk');$('#mClick').setAttribute('aria-pressed',m==='click');visitor.visible=m==='walk';marker.material.opacity=0;route=[];pending=null;setHint();
 if(!focused){const tgt=m==='walk'?new THREE.Vector3(visitor.position.x,.8,visitor.position.z):new THREE.Vector3(0,.8,0);tweenTo(tgt.clone().add(ISO),tgt,overviewZoom)}}

// ---------- loop ----------
function resize(){const w=innerWidth,h=innerHeight;aspect=w/h;const vh=frustumH();camera.left=-vh*aspect/2;camera.right=vh*aspect/2;camera.top=vh/2;camera.bottom=-vh/2;camera.updateProjectionMatrix();renderer.setSize(w,h)}
addEventListener('resize',resize);resize();
function sheetOffset(){if(!focused)return[0,0];return innerWidth>720?[Math.min(380,innerWidth)/2,0]:[0,innerHeight*0.27]}
function updateOffset(){const[ox,oy]=sheetOffset();const cur=camera.view&&camera.view.enabled?[camera.view.offsetX,camera.view.offsetY]:[0,0];const nx=cur[0]+(ox-cur[0])*0.22,ny=cur[1]+(oy-cur[1])*0.22;
 if(Math.abs(nx)<0.5&&Math.abs(ny)<0.5&&!ox&&!oy)camera.clearViewOffset();else camera.setViewOffset(innerWidth,innerHeight,nx,ny,innerWidth,innerHeight)}
const clock=new THREE.Clock();let bob=0;const tmp=new THREE.Vector3();
function tick(){const dt=Math.min(clock.getDelta(),0.05);
 if(!focused&&Math.abs(azimGoal-azim)>1e-4){azim+=(azimGoal-azim)*Math.min(1,dt*5);if(Math.abs(azimGoal-azim)<1e-3)azim=azimGoal;setISO()}
 if(mode==='walk'&&!focused){const f=new THREE.Vector3(-Math.cos(azim),0,-Math.sin(azim)),r=new THREE.Vector3(Math.sin(azim),0,-Math.cos(azim));const v=new THREE.Vector3();
  if(keys.w||keys.arrowup)v.add(f);if(keys.s||keys.arrowdown)v.sub(f);if(keys.d||keys.arrowright)v.add(r);if(keys.a||keys.arrowleft)v.sub(r);
  if(v.lengthSq()){route=[];pending=null;marker.material.opacity=0;v.normalize().multiplyScalar(2.4*dt);const np=visitor.position.clone().add(v);if(free(...toCell(np.x,np.z)))visitor.position.copy(np);visitor.rotation.y=Math.atan2(v.x,v.z);bob+=dt*10}}
 if(route.length&&mode==='walk'){const p=route[0];const d=p.clone().sub(visitor.position);d.y=0;const Ld=d.length(),step=3.2*dt;
  if(Ld<=step){visitor.position.set(p.x,0,p.z);route.shift();if(!route.length){marker.material.opacity=0;if(pending){const it=pending;pending=null;tmp.copy(it.center).sub(visitor.position);visitor.rotation.y=Math.atan2(tmp.x,tmp.z);focus(it)}}}
  else{d.multiplyScalar(step/Ld);visitor.position.add(d);visitor.rotation.y=Math.atan2(d.x,d.z);bob+=dt*10}}
 if(mode==='walk'&&!focused&&!route.length){let near=null;for(const it of room.items){if(it.spot&&Math.hypot(it.spot.x-visitor.position.x,it.spot.z-visitor.position.z)<0.5)near=it}if(near&&near!==lastArrive){lastArrive=near;focus(near)}if(!near)lastArrive=null}
 const bb=Math.abs(Math.sin(bob))*0.04;body.position.y=0.62+bb;head.position.y=1.38+bb;nose.position.y=head.position.y;ring.material.opacity=.45+Math.sin(performance.now()/400)*.15;
 if(marker.material.opacity>0)marker.scale.setScalar(1+Math.sin(performance.now()/180)*.08);
 if(tw){const k=ease(Math.min(1,(performance.now()-tw.t0)/tw.ms));const o0=tw.p0.clone().sub(tw.t0v),o1=tw.p1.clone().sub(tw.t1);const len=THREE.MathUtils.lerp(o0.length(),o1.length(),k);const dir=o0.normalize().lerp(o1.normalize(),k).normalize();
  target.lerpVectors(tw.t0v,tw.t1,k);camera.position.copy(target).add(dir.multiplyScalar(len));camera.zoom=THREE.MathUtils.lerp(tw.z0,tw.z1,k);camera.updateProjectionMatrix();if(k>=1)tw=null}
 else if(!focused&&mode==='walk'){target.lerp(tmp.set(visitor.position.x,0.8,visitor.position.z),0.06);camera.position.copy(target).add(ISO)}
 else if(!focused){camera.position.copy(target).add(ISO)}
 {const cd=camera.position.clone().sub(target);cd.y=0;cd.normalize();for(const w of room.outer){const goal=w.out.dot(cd)>0.15?0.3:WH;w.h+=(goal-w.h)*Math.min(1,dt*7);w.m.scale.y=w.h/WH;w.m.position.y=w.h/2;const show=w.h>WH*0.8;w.attached.forEach(g=>g.visible=show)}}
 camera.lookAt(target);updateOffset();renderer.render(scene,camera);requestAnimationFrame(tick)}
try{const s=localStorage.getItem('sg-lang');if(s&&T[s])lang=s;const q=new URLSearchParams(location.search).get('lang');if(q&&T[q])lang=q;const sp=+localStorage.getItem('bv-space');if(sp>=0&&sp<SPACES.length)spaceIdx=sp}catch(e){}
buildRoom(spaceIdx);applyLang();requestAnimationFrame(tick);
setTimeout(()=>{const l=$('#loader');l.style.opacity=0;setTimeout(()=>l.remove(),700)},350);
})();
</script>
