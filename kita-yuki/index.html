<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>西京社 Online Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
/* Layout: one full-screen 45° isometric room; HUD floats on the edges; a side sheet (desktop) / bottom sheet (phone) carries the work's caption and buy link. */
:root{
  --sumi:#1c1a17; --sumi-2:#2a2723; --kinari:#f2ede2; --suna:#e6dfd1; --shu:#b8442b; --tetsu:#23504a; --nibi:#8d867a;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-latin:"Cormorant Garamond","Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--sumi);color:var(--kinari);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.pointing{cursor:pointer}
#stage.dragging{cursor:grabbing}
canvas{display:block}
.hud{position:fixed;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
#top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--sumi) 0%,rgba(28,26,23,.0) 100%);padding-bottom:28px}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow{font-family:var(--f-latin);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--nibi)}
.ttl{font-family:var(--f-display);font-size:clamp(18px,2.4vw,26px);font-weight:600;letter-spacing:.06em;line-height:1.3;text-wrap:balance}
.ttl small{display:inline-block;margin-left:.6em;font-family:var(--f-body);font-size:12px;font-weight:400;letter-spacing:.06em;color:var(--suna);opacity:.75}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;border:1px solid rgba(242,237,226,.28);background:rgba(28,26,23,.72);backdrop-filter:blur(6px)}
.seg button{all:unset;cursor:pointer;font-size:12.5px;letter-spacing:.06em;padding:8px 12px;color:var(--suna);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--kinari);color:var(--sumi)}
.seg button:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
#hint{left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));font-size:12.5px;letter-spacing:.06em;color:var(--suna);
  background:rgba(28,26,23,.72);border:1px solid rgba(242,237,226,.16);padding:7px 14px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}
#strip{left:0;right:0;bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:24px;background:linear-gradient(rgba(28,26,23,0),var(--sumi) 60%);display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;transition:transform .45s,opacity .45s}
#strip::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;flex:none;display:flex;flex-direction:column;gap:6px;width:92px}
.chip .th{height:62px;background:var(--sumi-2) center/cover no-repeat;border:1px solid rgba(242,237,226,.18);transition:border-color .2s,transform .2s}
.chip:hover .th,.chip.on .th{border-color:var(--shu);transform:translateY(-2px)}
.chip span{font-size:11px;letter-spacing:.04em;color:var(--suna);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{font-family:var(--f-latin);font-weight:500;color:var(--nibi);margin-right:5px}
#rot{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;transition:opacity .4s}
#rot button{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border:1px solid rgba(242,237,226,.3);background:rgba(28,26,23,.78);color:var(--kinari)}
#rot button:hover{border-color:var(--shu);color:#fff}#rot button:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
body.focus #rot{opacity:0;pointer-events:none}
body.focus #strip{transform:translateY(110%);opacity:0}
body.focus #hint{opacity:0}

#sheet{position:fixed;z-index:6;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--kinari);color:var(--sumi);
  transform:translateX(102%);transition:transform .55s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;
  padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));box-sizing:border-box;gap:18px;overflow-y:auto}
body.focus #sheet{transform:none}
#sheet .no{font-family:var(--f-latin);font-size:13px;letter-spacing:.22em;color:var(--shu)}
#sheet h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:.06em;line-height:1.35;text-wrap:balance}
#sheet .artist{font-size:13px;letter-spacing:.08em;color:#5d574e}
#sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:13px;border-top:1px solid #d5ccbb;padding-top:16px}
#sheet dt{color:#7a7368;letter-spacing:.06em}
#sheet dd{margin:0;font-variant-numeric:tabular-nums}
#sheet p{margin:0;font-size:13.5px;line-height:1.9;color:#3b3732}
.price{font-family:var(--f-display);font-size:22px;letter-spacing:.04em}
.price small{font-family:var(--f-body);font-size:11.5px;color:#7a7368;margin-left:8px;letter-spacing:.04em}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:13px 16px;font-size:14px;letter-spacing:.1em}
.btn.buy{background:var(--shu);color:var(--kinari)}
.btn.buy:hover{background:#9f3923}
.btn.back{border:1px solid var(--sumi);color:var(--sumi)}
.btn.back:hover{background:var(--sumi);color:var(--kinari)}
.note{font-size:11px;color:#8a8275;letter-spacing:.04em;line-height:1.7}
.pill{align-self:flex-start;font-size:11px;letter-spacing:.12em;padding:3px 9px;border:1px solid var(--tetsu);color:var(--tetsu)}
.pill.sold{border-color:#9a9286;color:#9a9286}
#loader{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--sumi);font-family:var(--f-latin);letter-spacing:.3em;color:var(--nibi);font-size:13px;transition:opacity .6s}
@media (max-width:720px){
  #sheet{top:auto;left:0;width:100%;max-height:56%;transform:translateY(104%);padding-top:22px;gap:12px;
    padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  #sheet h2{font-size:21px}
  #sheet dl{gap:6px 14px;padding-top:12px}
  .acts{flex-direction:row;margin-top:6px}.acts .btn{flex:1;padding:11px 8px}
  .ctrls{flex-direction:column;align-items:flex-end;gap:6px;flex:none}
  .seg button{font-size:11.5px;padding:6px 9px}
  .brand{flex:1}
  .ttl small{display:block;margin:2px 0 0}
  body.focus #top{opacity:0;pointer-events:none}
  #top{transition:opacity .4s}
  #rot{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  #hint{bottom:calc(104px + env(safe-area-inset-bottom,0px));font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){#sheet,#strip{transition:none}}
</style>
</head>

</div>
<div class="hud" id="strip"></div>

<aside id="sheet" aria-live="polite">
  <span class="no" id="sNo"></span>
  <h2 id="sTitle"></h2>

  <p id="sText"></p>
  <div class="price" id="sPrice"></div>
  <div class="acts">

  const n=wk.normal,dist=wk.kind==='book'?30:1.25;let pos,zoomFit;const vw=VIEW*aspect,vh=VIEW;

  if(wk.kind==='book'){pos=wk.center.clone().add(new THREE.Vector3(0.5,1,0.5).normalize().multiplyScalar(dist));zoomFit=Math.min(vh*availH/(1.6),vw*availW/(1.8))}
  else{pos=wk.center.clone().add(n.clone().multiplyScalar(dist)).add(new THREE.Vector3(0,0.0,0));zoomFit=Math.min(vh*availH/(wk.h*1.55),vw*availW/(wk.w*1.45))}
  tweenTo(pos,wk.center,zoomFit)}
function unfocus(){if(!focused)return;focused=null;document.body.classList.remove('focus');document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  const tgt=mode==='walk'?new THREE.Vector3(visitor.position.x,0.8,visitor.position.z):target.clone().setY(0.8);
  if(mode==='click')tgt.set(0,0.8,0);tweenTo(tgt.clone().add(ISO),tgt,overviewZoom)}
function faceable(wk){if(wk.kind==='book')return;const step=Math.PI/4,cd=new THREE.Vector3(Math.cos(azimGoal),0,Math.sin(azimGoal));if(wk.normal.dot(cd)>0.3)return;
  let best=azimGoal,bd=1e9;const base=Math.round(azimGoal/step)*step;for(let k=-8;k<=8;k++){const a=base+k*step;const d=new THREE.Vector3(Math.cos(a),0,Math.sin(a));if(wk.normal.dot(d)>0.6&&Math.abs(a-azimGoal)<bd){bd=Math.abs(a-azimGoal);best=a}}azimGoal=best}
function rotate(dir){if(focused)return;azimGoal+=dir*Math.PI/4}
function select(wk){faceable(wk);if(mode==='click'||!wk.spot){focus(wk);return}
  if(focused)unfocus();route=astar(visitor.position,wk.spot);pending=wk;showMarker(wk.spot)}
function walkTo(p){if(focused)unfocus();pending=null;route=astar(visitor.position,p);showMarker(route[route.length-1]||p)}
function showMarker(p){marker.position.set(p.x,0.012,p.z);marker.material.opacity=.7}

// ---------- input ----------
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(e){const r=renderer.domElement.getBoundingClientRect();ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
  const vis=o=>{while(o){if(!o.visible)return false;o=o.parent}return true};const hit=ray.intersectObjects(clickables,false).find(h=>vis(h.object));if(hit)return{ref:hit.object.userData.ref};const f=ray.intersectObject(floor)[0];return f?{floor:f.point}:null}
const ptrs=new Map();let drag=null,pinch0=null;
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,moved:false,tgt:target.clone()};
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),z:camera.zoom};drag=null}});
stage.addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch0&&ptrs.size===2&&!focused){const[a,b]=[...ptrs.values()];overviewZoom=THREE.MathUtils.clamp(pinch0.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch0.d,0.6,2.4);camera.zoom=overviewZoom;camera.updateProjectionMatrix();return}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>6)drag.moved=true;
    if(drag.moved&&!focused&&mode==='click'){stage.classList.add('dragging');const s=VIEW/innerHeight/camera.zoom;const fwd=new THREE.Vector3(-Math.cos(azim),0,-Math.sin(azim)),right=new THREE.Vector3(Math.sin(azim),0,-Math.cos(azim));
      const nt=drag.tgt.clone().add(right.multiplyScalar(-dx*s)).add(fwd.multiplyScalar(dy*s*1.35));nt.x=THREE.MathUtils.clamp(nt.x,-RX,RX);nt.z=THREE.MathUtils.clamp(nt.z,-RZ,RZ);target.copy(nt);camera.position.copy(target).add(ISO)}
    return}
  const p=pick(e);const ref=p&&p.ref;if(ref!==hovered){if(hovered)hovered.hl.material.opacity=0;hovered=ref||null;if(hovered&&!focused)hovered.hl.material.opacity=.85}
  stage.classList.toggle('pointing',!!ref||(mode==='walk'&&!!(p&&p.floor)))});
const end=e=>{ptrs.delete(e.pointerId);stage.classList.remove('dragging');if(ptrs.size<2)pinch0=null;
  if(drag&&!drag.moved&&e.type==='pointerup'){const p=pick(e);
    if(p&&p.ref){if(focused===p.ref)return;select(p.ref)}
    else if(focused)unfocus();
    else if(p&&p.floor&&mode==='walk')walkTo(p.floor)}
  drag=null};
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
stage.addEventListener('wheel',e=>{e.preventDefault();if(focused)return;overviewZoom=THREE.MathUtils.clamp(camera.zoom*Math.exp(-e.deltaY*0.0012),0.6,2.4);camera.zoom=overviewZoom;camera.updateProjectionMatrix()},{passive:false});
addEventListener('keydown',e=>{if(e.key==='Escape')unfocus();if(e.key==='q'||e.key==='Q')rotate(1);if(e.key==='e'||e.key==='E')rotate(-1);keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
$('#sBack').onclick=unfocus;$('#rotL').onclick=()=>rotate(1);$('#rotR').onclick=()=>rotate(-1);
$('#mWalk').onclick=()=>setMode('walk');$('#mClick').onclick=()=>setMode('click');
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('sg-lang',lang)}catch(e){}applyLang()});
function setMode(m){mode=m;$('#mWalk').setAttribute('aria-pressed',m==='walk');$('#mClick').setAttribute('aria-pressed',m==='click');visitor.visible=m==='walk';marker.material.opacity=0;route=[];pending=null;setHint();
  if(!focused){const tgt=m==='walk'?new THREE.Vector3(visitor.position.x,.8,visitor.position.z):new THREE.Vector3(0,.8,0);tweenTo(tgt.clone().add(ISO),tgt,m==='walk'?overviewZoom:Math.min(overviewZoom,1))}}

// ---------- loop ----------
function resize(){const w=innerWidth,h=innerHeight;aspect=w/h;const vh=VIEW*(w<720?1.25:1);camera.left=-vh*aspect/2;camera.right=vh*aspect/2;camera.top=vh/2;camera.bottom=-vh/2;
  camera.updateProjectionMatrix();renderer.setSize(w,h)}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();let bob=0;
function tick(){const dt=Math.min(clock.getDelta(),0.05);
  if(!focused&&Math.abs(azimGoal-azim)>1e-4){azim+=(azimGoal-azim)*Math.min(1,dt*5);if(Math.abs(azimGoal-azim)<1e-3)azim=azimGoal;setISO()}
  // keyboard walking (screen-relative)
  if(mode==='walk'&&!focused){const f=new THREE.Vector3(-Math.cos(azim),0,-Math.sin(azim)),r=new THREE.Vector3(Math.sin(azim),0,-Math.cos(azim));const v=new THREE.Vector3();
    if(keys.w||keys.arrowup)v.add(f);if(keys.s||keys.arrowdown)v.sub(f);if(keys.d||keys.arrowright)v.add(r);if(keys.a||keys.arrowleft)v.sub(r);
    if(v.lengthSq()){route=[];pending=null;marker.material.opacity=0;v.normalize().multiplyScalar(2.4*dt);const np=visitor.position.clone().add(v);const[i,j]=toCell(np.x,np.z);
      if(i>=0&&j>=0&&i<GX&&j<GZ&&!blocked[i+j*GX])visitor.position.copy(np);visitor.rotation.y=Math.atan2(v.x,v.z);bob+=dt*10}}
  if(route.length&&mode==='walk'){const p=route[0];const d=p.clone().sub(visitor.position);d.y=0;const L=d.length();const step=3.2*dt;
    if(L<=step){visitor.position.set(p.x,0,p.z);route.shift();if(!route.length){marker.material.opacity=0;if(pending){const wk=pending;pending=null;visitor.rotation.y=Math.atan2(-wk.normal.x||(wk.center.x-visitor.position.x),-wk.normal.z||(wk.center.z-visitor.position.z));focus(wk)}}}
    else{d.multiplyScalar(step/L);visitor.position.add(d);visitor.rotation.y=Math.atan2(d.x,d.z);bob+=dt*10}}
  // auto-focus by proximity (keyboard walking)
  if(mode==='walk'&&!focused&&!route.length){let near=null;for(const wk of works){if(wk.spot.distanceTo(new THREE.Vector3(visitor.position.x,0,visitor.position.z))<0.55)near=wk}
    if(near&&near!==lastArrive){lastArrive=near;focus(near)}if(!near)lastArrive=null}
  body.position.y=0.62+Math.abs(Math.sin(bob))*0.04;head.position.y=1.38+Math.abs(Math.sin(bob))*0.04;nose.position.y=head.position.y;ring.material.opacity=.45+Math.sin(performance.now()/400)*.15;
  if(marker.material.opacity>0)marker.scale.setScalar(1+Math.sin(performance.now()/180)*.08);
  // camera
  if(tw){const k=ease(Math.min(1,(performance.now()-tw.t0)/tw.ms));
    // arc the offset direction so the move reads as one sweep
    const o0=tw.p0.clone().sub(tw.t0v),o1=tw.p1.clone().sub(tw.t1);const len=THREE.MathUtils.lerp(o0.length(),o1.length(),k);const dir=o0.normalize().lerp(o1.normalize(),k).normalize();
    target.lerpVectors(tw.t0v,tw.t1,k);camera.position.copy(target).add(dir.multiplyScalar(len));camera.zoom=THREE.MathUtils.lerp(tw.z0,tw.z1,k);camera.updateProjectionMatrix();if(k>=1)tw=null}
  else if(!focused&&mode==='walk'){const goal=new THREE.Vector3(visitor.position.x,0.8,visitor.position.z);target.lerp(goal,0.06);camera.position.copy(target).add(ISO)}
  else if(!focused){camera.position.copy(target).add(ISO)}
  {const cd=camera.position.clone().sub(target);cd.y=0;cd.normalize();
   for(const w of outer){const goal=w.out.dot(cd)>0.15?0.32:WH;w.h+=(goal-w.h)*Math.min(1,dt*7);w.m.scale.y=w.h/WH;w.m.position.y=w.h/2}
   for(const wk of works){if(!wk.grp)continue;const w=outer.find(o=>o.k===wk.wall);if(w)wk.grp.visible=w.h>WH*0.8}}
  camera.lookAt(target);updateOffset();
  renderer.render(scene,camera);requestAnimationFrame(tick)}
try{const s=localStorage.getItem('sg-lang');if(s&&T[s])lang=s}catch(e){}try{const q=new URLSearchParams(location.search).get('lang');if(q&&T[q])lang=q}catch(e){}
applyLang();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{});
requestAnimationFrame(tick);
setTimeout(()=>{const l=$('#loader');l.style.opacity=0;setTimeout(()=>l.remove(),700)},350);
})();
</script>
