<head>

<style>
:root{--ink:#f3efe6;--sub:#b9b2a3;--line:rgba(243,239,230,.18);--panel:rgba(20,19,17,.92);--acc:#d9b45a;--bg:#141311}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","PingFang SC","Hiragino Sans","Helvetica Neue",Arial,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}#c.drag{cursor:grabbing}
button{font:inherit;color:inherit}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 18px;background:rgba(14,13,12,.86);border-bottom:1px solid var(--line);pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.org{font-size:10px;letter-spacing:.18em;color:var(--sub)}
h1{margin:4px 0 2px;font-family:"Shippori Mincho","Noto Serif JP","Songti SC",serif;font-weight:500;font-size:22px;letter-spacing:.04em}
.dates{font-size:12px;color:var(--sub)}
.badge{display:inline-block;margin-left:8px;padding:2px 7px;border:1px solid var(--acc);color:var(--acc);font-size:10px;letter-spacing:.08em;vertical-align:middle}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb{background:rgba(243,239,230,.08);border:1px solid var(--line);padding:6px 10px;font-size:12px;cursor:pointer}
.tb:hover,.tb.on{background:var(--ink);color:#141311}
.rooms{position:fixed;left:18px;top:104px;display:flex;flex-direction:column;gap:6px;z-index:5}
.room{display:flex;gap:10px;align-items:center;color:var(--ink);background:rgba(14,13,12,.86);border:1px solid var(--line);padding:8px 12px;cursor:pointer;text-align:left;min-width:190px}
.room small{font-size:10px;letter-spacing:.14em;color:var(--sub)}.room b{font-weight:500}
.room.on{border-color:var(--acc);background:#2b2418}
.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);font-size:11px;color:var(--sub);background:rgba(10,10,9,.6);padding:6px 12px;border:1px solid var(--line);z-index:4;white-space:nowrap}
.staging{position:fixed;right:18px;bottom:18px;font-size:10px;color:var(--sub);z-index:4}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:8;overflow-y:auto;transform:translateX(102%);transition:transform .35s ease;padding:22px 24px 40px}
.panel.open{transform:none}
.x{position:sticky;top:0;float:right;background:none;border:1px solid var(--line);width:34px;height:34px;cursor:pointer;font-size:16px}
.eb{font-size:10px;letter-spacing:.16em;color:var(--acc)}
.panel h2{font-family:"Shippori Mincho","Noto Serif JP",serif;font-weight:500;font-size:30px;margin:6px 0 2px}
.meta{font-size:12px;color:var(--sub)}
.nfs{display:inline-block;margin:10px 0 4px;padding:3px 9px;border:1px solid var(--ink);font-size:11px;letter-spacing:.06em}
.stage{margin:14px 0 8px;background:#0b0b0a;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;aspect-ratio:4/5}
.stage img,.stage video{max-width:100%;max-height:100%;display:block}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs button{width:58px;height:58px;padding:0;border:1px solid var(--line);background:#0b0b0a;cursor:pointer;position:relative;overflow:hidden}
.thumbs button.on{border-color:var(--acc)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .v{font-size:9px;line-height:1.2;padding:4px;color:var(--ink)}
.cap{font-size:11px;color:var(--sub);margin:6px 0 0;min-height:1em}
.desc{font-size:13.5px;line-height:1.9;margin:16px 0}
.credit{font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:10px;font-style:italic}
.arbox{margin:18px 0;padding:14px;border:1px solid var(--line);display:flex;gap:14px;align-items:center}
.arbtn{display:inline-block;background:var(--ink);color:#141311;text-decoration:none;padding:10px 16px;font-weight:600;font-size:14px}
.arbox img{width:104px;height:104px;background:#fff;padding:4px}
.arbox p{font-size:11px;color:var(--sub);margin:8px 0 0;line-height:1.6}
.lnk{font-size:12px;color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.mbox{background:#1b1a17;border:1px solid var(--line);max-width:720px;width:100%;max-height:88vh;overflow-y:auto;padding:26px 28px}
.mbox h3{font-family:"Shippori Mincho","Noto Serif JP",serif;font-weight:500;font-size:20px;margin:18px 0 8px}
.mbox h3:first-of-type{margin-top:0}
.mbox p{font-size:13.5px;line-height:1.9;margin:0 0 10px}
.bio{display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:start}
.bio img{width:100%;display:block}
.note{font-size:12px;color:var(--sub)}
.foot{border-top:1px solid var(--line);margin-top:18px;padding-top:12px;font-size:12px;color:var(--sub)}
.foot a{color:var(--ink)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:6}#fade.on{opacity:1}
.arcta{position:fixed;right:18px;bottom:44px;z-index:5;background:var(--ink);color:#141311;border:0;padding:12px 18px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub);z-index:10;background:var(--bg);transition:opacity .5s}
@media (max-width:720px){
 h1{font-size:15px;margin:0}.top{padding:8px 10px}.dates{font-size:10px}.org{display:none}.tb{padding:4px 7px;font-size:11px}.badge{margin-left:0}
 .rooms{top:auto;bottom:52px;left:8px;right:8px;flex-direction:row}.room{min-width:0;flex:1;padding:6px 8px;flex-direction:column;align-items:flex-start;gap:0}.room b{font-size:12px}
 .hint{display:none}.staging{display:none}.arcta{right:8px;left:8px;bottom:104px;font-size:13px;padding:10px}
 .stage{max-height:40vh;aspect-ratio:auto;height:40vh}
 .panel{top:auto;height:74vh;width:100%;border-left:0;border-top:1px solid var(--line);transform:translateY(102%)}
 .bio{grid-template-columns:1fr}.bio img{max-width:220px}
 .arbox img{display:none}
}
@media (hover:none){.arbox img{display:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="i18n.js"></script>
<script>
(function(){
const PREVIEW = true;
const T = window.AP_TEXT, W = window.AP_WORKS;
const Q = new URLSearchParams(location.search); const HS=(location.hash||'').slice(1).split('-'); if(!Q.get('work')&&['piko','thistle','rebirth'].includes(HS[0])) Q.set('work',HS[0]); if(!Q.get('lang')&&['ja','zh','en'].includes(HS[1]||HS[0])) Q.set('lang',HS[1]||HS[0]);
let lang = (Q.get('lang')||'').slice(0,2);
if(!T[lang]){ const n=(navigator.language||'ja').toLowerCase(); lang = n.startsWith('zh')?'zh':n.startsWith('en')?'en':'ja'; }
let room = 0, curWork = null, curItem = 0;
const $ = id => document.getElementById(id);
const LI = {ja:0,zh:1,en:2};

/* ---------- three.js ---------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, .05, 200);
const loader = new THREE.TextureLoader();
const hemi = new THREE.HemisphereLight(0xffffff, 0x444033, .75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, .75); sun.position.set(4,8,5); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); Object.assign(sun.shadow.camera,{left:-6,right:6,top:6,bottom:-6}); scene.add(sun);

const M = (c,o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.9, metalness:0},o));
function box(w,h,d,mat,x=0,y=0,z=0,parent){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; (parent||scene).add(m); return m; }
function cyl(rt,rb,h,mat,x,y,z,parent,seg=16){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat); m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; parent.add(m); return m; }

const clickables = [];
function tex(name){ const t=loader.load('assets/'+name+'.jpg', ()=>{ loaded++; checkLoad(); }); t.encoding=THREE.sRGBEncoding; t.anisotropy=4; return t; }
let loaded=0, need=0;
function checkLoad(){ if(loaded>=need){ const l=$('load'); l.style.opacity=0; setTimeout(()=>l.remove(),600);} }
/* framed artwork image: image plane is MeshBasic (colours shown as supplied) */
function art(name, w, ratio, frameCol, workId, itemIndex, parent){
  need++;
  const h = w/ratio, g = new THREE.Group(), f=.035;
  box(w+f*2, h+f*2, .04, M(frameCol,{roughness:.6}), 0, 0, -.025, g);
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:tex(name), toneMapped:false}));
  p.position.z = .001; g.add(p);
  p.userData = {work:workId, item:itemIndex}; clickables.push(p);
  parent.add(g); return g;
}
const videos = {};
function vscreen(name, w, frameCol, workId, itemIndex, parent){
  const v = document.createElement('video'); v.src='assets/'+name+'.mp4'; v.muted=true; v.loop=true; v.playsInline=true; v.setAttribute('playsinline',''); v.preload='auto';
  v.play().catch(()=>{}); videos[name]=v;
  const t = new THREE.VideoTexture(v); t.encoding=THREE.sRGBEncoding;
  const h = w*16/9, g=new THREE.Group(), f=.03;
  box(w+f*2,h+f*2,.05,M(frameCol,{roughness:.5}),0,0,-.03,g);
  const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:t, toneMapped:false}));
  p.position.z=.001; g.add(p); p.userData={work:workId,item:itemIndex}; clickables.push(p);
  parent.add(g); return g;
}
let floatGroup, starPts;
const rooms = [new THREE.Group(), new THREE.Group(), new THREE.Group()];
rooms.forEach(r=>{ r.visible=false; scene.add(r); });
const anim = [];   /* per-frame callbacks: fn(t, roomIndex) */
function rnd(a,b){ return a+Math.random()*(b-a); }
function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=4; return t; }
function stars(parent,n,rMin,rMax,size,color){ const g=new THREE.BufferGeometry(), p=new Float32Array(n*3);
  for(let i=0;i<n;i++){ const r=rnd(rMin,rMax), t=Math.random()*Math.PI*2, ph=Math.acos(rnd(-1,1)); p.set([r*Math.sin(ph)*Math.cos(t), r*Math.cos(ph), r*Math.sin(ph)*Math.sin(t)],i*3); }
  g.setAttribute('position',new THREE.BufferAttribute(p,3)); const pts=new THREE.Points(g,new THREE.PointsMaterial({color,size,sizeAttenuation:true,transparent:true,opacity:.9,depthWrite:false})); parent.add(pts); return pts; }
/* gold crack polylines drawn on a canvas */
function cracks(ctx,w,h,n,width,col){ ctx.strokeStyle=col; ctx.lineCap='round'; ctx.lineJoin='round';
  for(let k=0;k<n;k++){ let x=Math.random()*w, y=Math.random()*h, a=Math.random()*Math.PI*2; ctx.lineWidth=width*rnd(.6,1.4); ctx.beginPath(); ctx.moveTo(x,y);
    const L=rnd(8,22); for(let i=0;i<L;i++){ a+=rnd(-.7,.7); x+=Math.cos(a)*rnd(14,40); y+=Math.sin(a)*rnd(14,40); ctx.lineTo(x,y);
      if(Math.random()<.12){ ctx.stroke(); ctx.beginPath(); ctx.moveTo(x,y); a+=rnd(-1.5,1.5); } } ctx.stroke(); } }

/* ===== ROOM 1 : Land of Kintsugi (Piko) ===== */
(function(){
  const R=rooms[0];
  stars(R,1800,40,90,.18,0xcfe0ff);
  /* porcelain ground with cobalt pattern + gold seams */
  const base=canvasTex(2048,2048,(c,w,h)=>{ c.fillStyle='#f4f2ec'; c.fillRect(0,0,w,h);
    c.strokeStyle='#2350a8'; c.fillStyle='#2350a8';
    for(let r=1;r<9;r++){ c.lineWidth=r%3===0?10:3; c.globalAlpha=.55; c.beginPath(); c.arc(w/2,h/2,r*118,0,Math.PI*2); c.stroke(); }
    c.globalAlpha=.75;
    for(let ring=0;ring<4;ring++){ const R0=180+ring*230, n=10+ring*8;
      for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, x=w/2+Math.cos(a)*R0, y=h/2+Math.sin(a)*R0;
        c.save(); c.translate(x,y); c.rotate(a);
        for(let p=0;p<5;p++){ c.rotate(Math.PI*2/5); c.beginPath(); c.ellipse(0,-22-ring*4,9+ring*2,22+ring*4,0,0,Math.PI*2); c.fill(); }
        c.beginPath(); c.globalAlpha=.4; c.arc(0,0,60+ring*10,-.6,.6); c.stroke(); c.globalAlpha=.75; c.restore(); } }
    c.globalAlpha=1; cracks(c,w,h,26,7,'#c99a2e'); });
  const glow=canvasTex(2048,2048,(c,w,h)=>{ c.fillStyle='#000'; c.fillRect(0,0,w,h); });
  const ground=new THREE.Mesh(new THREE.CircleGeometry(14,96), new THREE.MeshStandardMaterial({map:base, roughness:.28, metalness:.05}));
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; R.add(ground);
  /* gold seams in relief across the ground */
  const goldM=new THREE.MeshStandardMaterial({color:0xd4a437, metalness:1, roughness:.25, emissive:0x5a3a00, emissiveIntensity:.6});
  for(let k=0;k<6;k++){ let x=rnd(-9,9), z=rnd(-9,9), a=rnd(0,6.28); const pts=[];
    for(let i=0;i<14;i++){ pts.push(new THREE.Vector3(x,.012,z)); a+=rnd(-.6,.6); x+=Math.cos(a)*rnd(.4,1.1); z+=Math.sin(a)*rnd(.4,1.1); }
    const tube=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),60,.012,5,false),goldM); R.add(tube); }
  /* giant broken bowls, mended with gold */
  const bowlTex=canvasTex(1024,512,(c,w,h)=>{ c.fillStyle='#f6f4ee'; c.fillRect(0,0,w,h); c.fillStyle='#2b56ad'; c.fillRect(0,40,w,26); c.fillRect(0,h-90,w,14);
    c.globalAlpha=.8; for(let i=0;i<18;i++){ const x=i*w/18+28; c.beginPath(); c.arc(x,180,22,0,Math.PI*2); c.fill(); c.fillRect(x-3,200,6,90); }
    c.globalAlpha=1; cracks(c,w,h,6,5,'#d4a437'); });
  function bowl(x,y,z,s,rx,rz,arc){ const pts=[]; for(let i=0;i<=20;i++){ const a=i/20*Math.PI/2; pts.push(new THREE.Vector2(Math.sin(a)*1+.02, -Math.cos(a)*1+1)); }
    const m=new THREE.Mesh(new THREE.LatheGeometry(pts,64,0,arc), new THREE.MeshStandardMaterial({map:bowlTex, side:THREE.DoubleSide, roughness:.25}));
    m.position.set(x,y,z); m.scale.setScalar(s); m.rotation.set(rx,rnd(0,6.28),rz); m.castShadow=true; R.add(m); return m; }
  bowl(-8,-.8,-10,4.6,.35,.2,Math.PI*1.4); bowl(10,-1.5,-8,5.5,-.2,.4,Math.PI*1.1); bowl(-10,-.6,6,3.2,.5,-.3,Math.PI*1.6);
  /* floating porcelain shards */
  const shardM=new THREE.MeshStandardMaterial({map:bowlTex, side:THREE.DoubleSide, roughness:.3});
  for(let i=0;i<14;i++){ const g=new THREE.Mesh(new THREE.CircleGeometry(rnd(.25,.7),3+Math.floor(rnd(0,3))),shardM); const a=rnd(0,6.28), r=rnd(4,9);
    g.position.set(Math.cos(a)*r, rnd(1.5,5), Math.sin(a)*r); g.rotation.set(rnd(0,3),rnd(0,3),rnd(0,3)); R.add(g);
    const sp=rnd(.1,.3), y0=g.position.y; anim.push((t,ri)=>{ if(ri!==0) return; g.rotation.x+=.002; g.rotation.y+=.003; g.position.y=y0+Math.sin(t*sp+i)*.25; }); }
  /* central stage */
  const stage=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.25,.28,64), new THREE.MeshStandardMaterial({map:base, roughness:.25})); stage.position.y=.14; stage.castShadow=stage.receiveShadow=true; R.add(stage);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(2.18,.03,8,96),goldM); ring.rotation.x=Math.PI/2; ring.position.y=.29; R.add(ring);
  /* the work: video as the centrepiece, images on porcelain stands */
  const sv=new THREE.Group(); sv.position.set(0,1.62,-.3); R.add(sv); vscreen('piko_video',.72,0xd4a437,'piko',5,sv);
  const ph=[['piko_front',1.0,1800/2250,-1.45,1.05,-.1,.5],['piko_face',.6,1,1.5,.85,-.1,-.5],['piko_gold',.55,1,3.4,1.2,1.2,-1.1],['piko_photo1',.55,861/951,-3.4,1.2,1.2,1.1],['piko_photo2',.4,1179/2556,2.9,1.6,-1.8,-.6]];
  ph.forEach(([n,w,rt,x,y,z,ry],k)=>{ const g=new THREE.Group(); g.position.set(x,y+.28,z); g.rotation.y=ry; R.add(g);
    art(n,w,rt,0xd4a437,'piko',k,g); const y0=g.position.y; anim.push((t,ri)=>{ if(ri===0) g.position.y=y0+Math.sin(t*.7+k)*.04; }); });
  const l=new THREE.PointLight(0xffe2a8,.7,12); l.position.set(0,4,3); R.add(l);
})();

/* ===== ROOM 2 : Crystal Greenhouse (Thistle) — visitor at insect scale ===== */
(function(){
  const R=rooms[1];
  const mossTex=canvasTex(1024,1024,(c,w,h)=>{ c.fillStyle='#3f5a2c'; c.fillRect(0,0,w,h); for(let i=0;i<9000;i++){ c.fillStyle=['#4d6b33','#5f7f3c','#34502a','#728f45'][i%4]; c.globalAlpha=rnd(.3,.9); c.beginPath(); c.arc(Math.random()*w,Math.random()*h,rnd(1,5),0,7); c.fill(); } });
  mossTex.wrapS=mossTex.wrapT=THREE.RepeatWrapping; mossTex.repeat.set(6,6);
  const gg=new THREE.PlaneGeometry(40,40,80,80); const pa=gg.attributes.position;

const Sound = (function(){

    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+attack+decay);

})();

/* ---------- UI ---------- */
function itemsOf(w){ return w.images.map(n=>({type:'img',name:n})).concat([{type:'video',name:w.video}]); }
function showItem(i){
  const w=curWork, it=itemsOf(w)[i], L=T[lang]; curItem=i; const st=$('p-stage'); st.innerHTML=''; Sound.setDuck(false);
  if(it.type==='img'){ const im=new Image(); im.src='assets/'+it.name+'.jpg'; im.alt=w.alt[it.name][LI[lang]]; st.appendChild(im); $('p-cap').textContent=im.alt; }
  else { const v=document.createElement('video'); v.src='assets/'+it.name+'.mp4'; v.controls=true; v.playsInline=true; v.setAttribute('playsinline',''); v.loop=true; v.muted=true; v.autoplay=true; const dk=()=>Sound.setDuck(!v.muted&&!v.paused); v.onplay=dk; v.onpause=dk; v.onvolumechange=dk; st.appendChild(v); $('p-cap').textContent=L.video+'：'+L.videoNote; }
  [...$('p-thumbs').children].forEach((b,k)=>b.classList.toggle('on',k===i));
}
function openWork(id, item){
  const w=W.find(x=>x.id===id); if(!w) return; curWork=w; if(w.room!==room) setRoom(w.room);
  renderPanel(); showItem(item||0); $('panel').classList.add('open');
}
function renderPanel(){
  const w=curWork, L=T[lang]; if(!w) return;
  $('p-eb').textContent=L.roomLabel+' 0'+(w.room+1)+' ・ '+L.rooms[w.room];
  $('p-title').textContent=w.title; $('p-meta').textContent=w.year+' ・ '+L.type;
  $('p-nfs').textContent=L.notForSale; $('p-desc').textContent=w.desc[lang]; $('p-credit').textContent=w.credit;
  $('p-ar').textContent=L.viewAR; $('p-ar').href=w.ar; $('p-qr').src='assets/qr_'+w.id+'.png'; $('p-qr').alt='QR: '+w.title+' AR';
  $('p-qrnote').textContent=L.qrNote; $('p-space').textContent=w.space?L.space2m:'';
  $('p-page').textContent=L.workPage+' ↗'; $('p-page').href=w.page;
  const th=$('p-thumbs'); th.innerHTML='';
  itemsOf(w).forEach((it,k)=>{ const b=document.createElement('button');
    if(it.type==='img'){ const im=new Image(); im.src='assets/'+it.name+'.jpg'; im.alt=w.alt[it.name][LI[lang]]; b.appendChild(im); }
    else { b.innerHTML='<span class="v">▶ '+L.video+'</span>'; b.setAttribute('aria-label',L.video); }
    b.onclick=()=>showItem(k); th.appendChild(b); });
}
function applyLang(l){
  lang=l; const L=T[l]; document.documentElement.lang=l==='zh'?'zh-Hans':l;
  document.title=L.htmlTitle; document.querySelector('meta[name=description]').content=L.metaDesc;
  $('t-org').textContent=L.org; $('t-title').textContent=L.title; $('t-dates').textContent=L.dates;
  $('t-prev').textContent=L.preview; $('t-prev').style.display=PREVIEW?'':'none';
  $('b-about').textContent=L.about; $('b-how').textContent=L.howto; $('t-hint').textContent=L.hint; $('t-staging').textContent=L.staging;
  document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  $('rooms').innerHTML=''; W.forEach((w,k)=>{ const b=document.createElement('button'); b.className='room'+(k===room?' on':'');
    b.innerHTML='<small>'+L.roomLabel+' 0'+(k+1)+' ・ '+L.rooms[k]+'</small><b>'+w.title+'</b>'; b.onclick=()=>{ setRoom(k); openWork(w.id,0); }; $('rooms').appendChild(b); });
  $('a-introH').textContent=L.introH; $('a-intro').textContent=L.intro; $('a-bioH').textContent=L.bioH; $('a-bio').textContent=L.bio;
  $('a-site').textContent=L.artistSite+' ↗'; $('a-portrait').alt=L.portraitAlt; $('a-org2').textContent=L.organizer; $('a-contact').textContent=L.contact; $('a-back').textContent='← '+L.back;
  $('h-howH').textContent=L.howH; $('h-phone').textContent=L.howPhone; $('h-pc').textContent=L.howPC; $('h-req').textContent=L.howReq; $('h-noticeH').textContent=L.noticeH; $('h-notice').textContent=L.notice;
  $('arcta').textContent=L.arCta+' ↗'; sndLabel(); $('a-sound').textContent=L.soundNote; $('px').setAttribute('aria-label',L.close); $('load').textContent=L.loading;
  if(curWork){ renderPanel(); showItem(curItem); }
}
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>applyLang(b.dataset.l));
$('px').onclick=()=>{ $('panel').classList.remove('open'); const pv=$('p-stage').querySelector('video'); if(pv) pv.pause(); Sound.setDuck(false); };
function sndLabel(){ const L=T[lang], o=Sound.isOn(); $('b-snd').textContent=(o?'♪ ':'')+(o?L.sndOn:L.sndOff); $('b-snd').classList.toggle('on',o); $('b-snd').setAttribute('aria-pressed',String(o)); }
$('b-snd').onclick=()=>{ Sound.toggle(); sndLabel(); };
$('arcta').onclick=()=>{ openWork(W[room].id,0); setTimeout(()=>$('p-ar').scrollIntoView({behavior:'smooth',block:'center'}),400); };
$('b-about').onclick=()=>$('m-about').classList.add('open');
$('b-how').onclick=()=>$('m-how').classList.add('open');
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m||e.target.hasAttribute('data-close')) m.classList.remove('open'); }));
addEventListener('keydown',e=>{ if(e.key==='Escape'){ document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open')); $('panel').classList.remove('open'); } });

applyLang(lang);
const startRoom = Math.max(0, ['piko','thistle','rebirth'].indexOf(Q.get('work')||''));
setRoom(startRoom, true);
if(Q.get('work')) openWork(W[startRoom].id,0); else $('m-about').classList.add('open');
setTimeout(()=>{ const l=$('load'); if(l){ l.style.opacity=0; setTimeout(()=>l.remove(),600);} },6000);
})();
</script>
</body>
</html>
